name: CD

on:
  push:
    branches: [develop, main]

permissions:
  contents: read

# develop -> dev account, main -> prod account. Environment = branch name.
jobs:
  deploy:
    name: Provision VPC + EKS
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    concurrency:
      group: k8s-terraform-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      TF_VAR_environment: ${{ github.ref_name }}
      # Org-level values, MAIN/DEVELOP-suffixed, selected by branch.
      TF_STATE_BUCKET: ${{ github.ref_name == 'main' && secrets.TF_STATE_BUCKET_MAIN || secrets.TF_STATE_BUCKET_DEVELOP }}
      TF_VAR_aws_account_id: ${{ github.ref_name == 'main' && secrets.AWS_ACCOUNT_ID_MAIN || secrets.AWS_ACCOUNT_ID_DEVELOP }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ github.ref_name == 'main' && secrets.AWS_ACCESS_KEY_ID_MAIN || secrets.AWS_ACCESS_KEY_ID_DEVELOP }}
          aws-secret-access-key: ${{ github.ref_name == 'main' && secrets.AWS_SECRET_ACCESS_KEY_MAIN || secrets.AWS_SECRET_ACCESS_KEY_DEVELOP }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Validate state bucket config
        run: |
          if [ -z "${TF_STATE_BUCKET}" ]; then
            echo "TF_STATE_BUCKET is empty. Set org secret TF_STATE_BUCKET_${{ github.ref_name == 'main' && 'MAIN' || 'DEVELOP' }} and grant repo access."
            exit 1
          fi

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=k8s/${{ github.ref_name }}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true"

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false -var="aws_region=${AWS_REGION}"

      - name: Show cluster info
        run: |
          echo "cluster_name: $(terraform output -raw cluster_name)"
          echo "vpc_id:       $(terraform output -raw vpc_id)"
